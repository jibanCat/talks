# Publishes site/ to GitHub Pages at https://jibancat.github.io/talks/
# Manual only: Actions → Deploy → Run workflow. The job runs in the github-pages environment, so it can be held for approval.
# Actions are pinned to full commit SHAs (tag in the comment).
# The talk itself is not in this repository: it is a Release asset of this repository, pinned by name and sha256 in
# lya/RELEASE.json, and unpacked into site/lya/ at deploy time. This workflow has no access to any other repository.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the released talk (pinned in lya/RELEASE.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(jq -r .release lya/RELEASE.json)
          asset=$(jq -r .asset lya/RELEASE.json)
          want=$(jq -r .sha256 lya/RELEASE.json)
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "$want  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          # nothing may land outside site/lya/ or replace the landing page
          if tar -tzf "$RUNNER_TEMP/$asset" | grep -qE '^/|(^|/)\.\.(/|$)|^index\.html$'; then echo "unexpected paths in $asset"; exit 1; fi
          tar -xzf "$RUNNER_TEMP/$asset" -C site/lya --no-same-owner --no-same-permissions
          test -f site/lya/talk/index.html
          test -f site/lya/volume-spike/data/flux_cube_240.bin
          test -f site/lya/talk/stills/manifest.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
